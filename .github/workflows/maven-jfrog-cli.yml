name: Maven CI/CD with JFrog CLI

# Triggers
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK 8
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # Step 3: Setup JFrog CLI
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: ${{ secrets.JFROG_URL }}
        JF_USER: ${{ secrets.JFROG_USERNAME }}
        JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

    # Step 4: Configure JFrog CLI for Maven
    - name: Configure JFrog Maven
      run: |
        jf mvnc \
          --server-id-resolve=default-server \
          --server-id-deploy=default-server \
          --repo-resolve-releases=libs-release \
          --repo-resolve-snapshots=libs-snapshot \
          --repo-deploy-releases=libs-release \
          --repo-deploy-snapshots=libs-snapshot-local

    # Step 5: Build, Test and Deploy using JFrog CLI
    - name: Build and Deploy
      run: |
        # Build and create build-info
        jf mvn clean install -DskipTests -B --build-name=demo-project --build-number=${{ github.run_number }}
        
        # Collect environment variables
        jf rt bce demo-project ${{ github.run_number }}
        
        # Add git information
        jf rt bag demo-project ${{ github.run_number }}
        
        # Publish build info to Artifactory
        jf rt bp demo-project ${{ github.run_number }}

    # Step 6: Run Tests
    - name: Run Tests
      run: mvn test -B

    # Step 7: Upload artifacts to GitHub (optional backup)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-project-jar
        path: target/*.jar
        retention-days: 30
